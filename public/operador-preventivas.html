<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a26">
<link rel="manifest" href="/manifest.json?app=operador">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="General">
<title>GENERAL • Preventivas</title>
<link rel="icon" type="image/png" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/martianmono.woff2" as="font" type="font/woff2" crossorigin>
<!-- ⚠️ A MESMA FOLHA DAS IRMÃS. As três telas são a mesma superfície do
     operador; só o bloco `.pv-*` é exclusivo daqui, e ele mora no operador.css
     junto com o resto. Ver o cabeçalho de `operador-orcamentos.html`. -->
<link rel="stylesheet" href="/static/operador.css?v=91">
</head>
<body class="sem-trilho">

<!-- DIREÇÃO — Preventivas · 03/09/2026

     THESIS: o mês inteiro de manutenção preventiva numa tela, respondendo
     "o que falta fazer e quem vai" — nessa ordem. O contrato obriga a visita
     mensal; esta tela é o instrumento de cobrança dela.
     ⚠️ O QUE FALTA VEM PRIMEIRO E OCUPA A TELA. O que já foi feito recolhe
     para uma linha no fim, como em Aprovados: lista que guarda o passado vira
     cemitério que o operador aprende a ignorar.
     ⚠️ AGRUPADO POR ZONA, não por prédio. O despacho é regional — "manda a
     Zona Leste para o Cleber" — e é por zona que a decisão se toma.
     OWN-WORLD: o mesmo Chapa das telas irmãs, em registro de operação. -->

<header class="barra">
  <div class="barra-in">
    <div class="marca">
      <img src="/static/logo-topo.png" alt="GENERAL" width="826" height="180">
      <span>Preventivas</span>
    </div>
  </div>
  <div class="barra-acoes">
    <nav class="barra-nav" aria-label="Telas do operador">
      <a href="/operador/painel"><span class="nav-longo">A fila do turno</span><span class="nav-curto">Turno</span></a>
      <a href="/operador/painel/orcamentos">Aprovados</a>
      <button type="button" data-acao="ajuda">Ajuda</button>
    </nav>
    <!-- ⚠️ A GAVETA DE CONTA, e ela chegou aqui em 04/09/2026 porque
         "Trocar senha" era INALCANÇÁVEL nesta tela — só existia no Turno. O par
         solto "nome (texto) + Sair" que estava aqui também não cabia no
         celular: a 390px o wordmark pintava por cima da nav, e uma chapa só
         devolve 50px (a tabela está no `operador.css`, em "CELULAR ESTREITO").
         O comportamento vive no `operador-conta.js`, compartilhado pelas três
         telas — o Turno tinha 187 linhas disto embutidas e as irmãs, nenhuma.
         ⚠️ O id `btnSair` é o CONTRATO com o JS de cada tela: as três fazem o
         logout por id, não por `data-acao`. -->
    <div class="eu" id="eu">
      <button class="conta conta-eu" id="btnEu" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="euGaveta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5"/></svg>
        <span class="conta-rot" id="barraEu"></span>
        <svg class="eu-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
      <div class="eu-gaveta" id="euGaveta" role="menu" aria-labelledby="btnEu" hidden>
        <button class="eu-item" type="button" role="menuitem" data-acao="senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="7.5" cy="12" r="4.5"/><path d="M12 12h9M16.5 12v3.5M20 12v2.5"/></svg>
          <span>Trocar senha</span>
        </button>
        <!-- ⚠️ O id `btnSair` é o CONTRATO com o front de cada tela: as três
             fazem o logout por id, não por `data-acao`. Trocar o seletor aqui
             quebraria o logout sem erro nenhum no console. -->
        <button class="eu-item" id="btnSair" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M14 4H5v16h9"/><path d="M12 12h9M17.5 8l4 4-4 4"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main id="tela">
  <!-- O primeiro estado é "ainda não sei", nunca "está vazio" — mesma regra
       das telas irmãs. -->
  <div class="carregando" id="carregando">Carregando as preventivas do mês…</div>
</main>

<script src="/static/operador-conta.js?v=1" defer></script>
<script src="/static/inatividade.js?v=10" defer></script>
<script src="/static/operador-preventivas.js?v=7" defer></script>
<script src="/static/register-sw.js?v=51" defer></script>
</body>
</html>
