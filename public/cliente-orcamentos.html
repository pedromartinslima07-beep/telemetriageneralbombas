<body class="pagina-orcs">

<!--
  DIRECTION CONTRACT — orçamentos do cliente (surface/operate)

  ⚠️ ISTO É UMA PÁGINA, NÃO UMA FICHA. A v1 pôs os orçamentos em modais
  abertos por um card no meio do painel, e foi recusada. Um orçamento não é
  detalhe do painel: é um documento que a pessoa lê, pensa e às vezes mostra
  para outra pessoa antes de responder — o que pede URL própria, rolagem
  inteira e o voltar do celular funcionando. Modal não dá nenhuma das três.

  MATERIAL: o painel é instrumento (marinho, placa, sulcos gravados). Esta
  tela é PAPEL — chapas claras sobre o campo marinho. É a mesma distinção que
  existe fora da tela: o painel você olha, o orçamento você assina. Barra e
  rodapé continuam marinho, senão a pessoa acha que saiu do sistema.

  UM AMARELO POR TELA: é do "Aprovar orçamento". Por isso o PDF é botão de
  fio, e não o `.relatorio .btn-fio` do painel (aquele pinta de amarelo).
-->

<header class="barra" id="barra"><div class="barra-in">
  <!-- A marca leva de volta ao painel: é o caminho que todo mundo tenta antes
       de procurar um "voltar". logo-topo.png é o wordmark SEM a assinatura;
       o lockup completo aparece uma vez só, no rodapé. -->
  <a class="marca" href="/cliente/painel"><img src="/static/logo-topo.png" alt="GENERAL"></a>
  <a class="conta" href="/cliente/painel">
    <svg viewBox="0 0 24 24" stroke-linecap="square" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="conta-rot">Meu prédio</span>
  </a>
</div></header>

<main class="folha orcs-folha">

  <section class="orcs-abre">
    <p class="predio" id="nomePredio">&nbsp;</p>
    <h1 class="orcs-titulo" id="orcsTitulo">Orçamentos</h1>
    <p class="apoio" id="orcsApoio">Carregando…</p>
  </section>

  <div id="orcsLista" class="orcs-lista"></div>

  <!-- O documento aberto. Não é modal: é a mesma página trocando de conteúdo,
       com a lista escondida e a URL mudando para `?orc=N`. Assim o botão de
       voltar do navegador e o gesto de voltar do celular funcionam, e o mesmo
       link reabre o mesmo orçamento. -->
  <div id="orcDetalhe" class="orcs-detalhe" hidden></div>

</main>
