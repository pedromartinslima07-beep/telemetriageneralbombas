<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a26">
<title>GENERAL • Orçamentos (prévia)</title>
<link rel="icon" type="image/png" href="/static/favicon.png?v=3">
<link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/martianmono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/admin.css?v=250">
</head>
<body>
<!-- ⚠️ PÁGINA DE PRÉVIA, temporária, para olhar a seção Orçamentos sem sessão.
     O que vale é o admin.html — a marcação abaixo é cópia da seção de lá.
     Some quando não for mais precisa. -->

<div class="app" style="display:block;">
  <main class="main" style="padding:20px 24px;">
    <div class="section is-active" data-section="orcamentos" style="display:block;">

      <div class="orc-main-tabs" id="orcMainTabs">
        <button class="orc-main-tab is-active" data-orc-modo="avulso" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Criar orçamento
        </button>
        <button class="orc-main-tab" data-orc-modo="os" type="button">
          Solicitados pelos técnicos <span class="wa-count" id="navBadgeOrcamentosOS" style="display:none;">0</span>
        </button>
      </div>

      <div id="orcModoAvulso" style="display:none;">
        <div class="resumo-grid" id="avKpiGrid" style="margin-bottom:16px;"></div>
        <div class="ch-layout">
          <div class="ch-list-col">
            <div class="ch-toolbar">
              <div class="wa-tabs" role="tablist">
                <button class="wa-tab is-active" data-av-tab="todos" type="button">Todos <span class="wa-count" id="avCtTodos">0</span></button>
                <button class="wa-tab" data-av-tab="rascunho" type="button">Rascunho <span class="wa-count" id="avCtRascunho">0</span></button>
                <button class="wa-tab" data-av-tab="enviado" type="button">Enviado <span class="wa-count" id="avCtEnviado">0</span></button>
                <button class="wa-tab" data-av-tab="aprovado" type="button">Aprovado <span class="wa-count" id="avCtAprovado">0</span></button>
                <button class="wa-tab" data-av-tab="respondidos" type="button">Respondidos <span class="wa-count" id="avCtRespondidos">0</span></button>
              </div>
              <input id="avBusca" class="input" placeholder="Buscar condomínio ou Nº…">
              <button class="btn btnAccent btn-sm" id="avBtnNovo" type="button">+ Novo orçamento</button>
            </div>
            <div class="tableWrap ch-table-wrap">
              <div id="avCondoList" class="av-condo-list"></div>
              <div id="avEmpty" class="al-empty" style="display:none;"><p>Nenhum orçamento.</p></div>
            </div>
          </div>
          <aside class="ch-detail-col" id="avCondoDetail">
            <div class="ch-detail-empty"><p>Selecione um condomínio para ver os orçamentos</p></div>
          </aside>
        </div>
      </div>

      <div id="orcModoOS" style="display:none;">
        <div class="resumo-grid" id="orcKpiGrid" style="margin-bottom:16px;"></div>

        <div class="ch-layout">
          <div class="ch-list-col">
            <div class="ch-toolbar">
              <div class="wa-tabs" role="tablist">
                <button class="wa-tab is-active" data-orc-tab="todos" type="button">Todos <span class="wa-count" id="orcCtTodos">0</span></button>
                <button class="wa-tab" data-orc-tab="solicitado" type="button">Solicitados <span class="wa-count" id="orcCtSolicitado">0</span></button>
                <button class="wa-tab" data-orc-tab="pendente" type="button">Em orçamento <span class="wa-count" id="orcCtPendente">0</span></button>
                <button class="wa-tab" data-orc-tab="aprovado" type="button">Aprovados <span class="wa-count" id="orcCtAprovado">0</span></button>
                <button class="wa-tab" data-orc-tab="rejeitado" type="button">Rejeitados <span class="wa-count" id="orcCtRejeitado">0</span></button>
              </div>
              <input id="orcBusca" class="input" placeholder="Buscar condomínio ou técnico…">
              <select id="orcFiltroCondo" class="select">
                <option value="">Todos os condomínios</option>
              </select>
            </div>
            <div class="tableWrap ch-table-wrap">
              <div id="orcCondoList" class="av-condo-list"></div>
              <div id="orcEmpty" class="al-empty" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <p>Nenhum pedido de orçamento.</p>
              </div>
            </div>
          </div>

          <aside class="ch-detail-col" id="orcPainel">
            <div class="ch-detail-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
              <p>Selecione um condomínio para ver os pedidos</p>
            </div>
          </aside>
        </div>
      </div>

    </div>
  </main>
</div>

<span class="nav-badge" id="navBadgeOrcamentos" style="display:none;">0</span>

<div id="avModal" class="av-modal" style="display:none;" role="dialog" aria-modal="true">
  <div class="av-modal-backdrop" id="avModalBackdrop"></div>
  <div class="av-modal-dialog">
    <div id="avModalBody"></div>
  </div>
</div>

<!-- ⚠️ OS SETE ELEMENTOS ABAIXO NÃO SÃO DECORAÇÃO DA PRÉVIA. O admin.js tem
     `getElementById(x).addEventListener` no TOPO, sem `?.` — se um deles
     falta, o script estoura ali e todo o resto do arquivo nunca executa,
     deixando os `let` seguintes em TDZ. Foi exatamente o que aconteceu na
     primeira tentativa desta prévia: a tela abriu vazia e o erro real
     ("Cannot access '_orcModoBindFeito' before initialization") apontava
     para 4000 linhas depois da causa. -->
<aside id="sidebar" hidden></aside>
<div id="hardDeleteOverlay" style="display:none;">
  <input id="hardDeleteSenha" type="password">
  <button id="btnConfirmarHardDelete"></button>
  <button id="btnFecharHardDelete"></button>
  <button id="btnCancelarHardDelete"></button>
</div>
<button id="avEnvioFechar" hidden></button>
<button id="avEnvioCancelar" hidden></button>
<button id="avEnvioConfirmar" hidden></button>

<script src="/static/_orcamentos-preview.js?v=8"></script>
<script src="/static/admin.js?v=334" defer></script>
</body>
</html>
