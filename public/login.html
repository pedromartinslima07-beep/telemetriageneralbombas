<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Entrar • General Telemetria</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=3" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050f38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Telemetria">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

  <link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/martianmono.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="/static/login.css?v=7">
</head>
<body>
<!--
Esta tela é a costura entre a landing pública (/) e o painel interno. O visual
segue o mundo "Chapa" da landing — mesma paleta, mesmo chanfro de 45°, mesmas
fontes —, e NÃO o âmbar do Mission Control que existe atrás dela. Motivo em
DESIGN.md: #f0b014 é a interpretação do painel interno, não a cor
institucional; quem chega aqui vindo do site não pode sentir que trocou de
empresa no meio do caminho.
-->

<div class="entrada">

  <!-- ─── Lado da marca ─────────────────────────────────────────────────── -->
  <!-- ⚠️ A foto é `reservatorios.jpg` e a escolha não é estética: é a única do
       acervo que mostra RESERVATÓRIO, que é o que o produto vigia — todas as
       outras mostram bomba, quadro ou prumada. Ela também é a única em
       retrato, que é a forma deste painel, e o azul dos tanques e o uniforme
       azul-e-amarelo já são a paleta da marca.
       ⚠️ O enquadramento corta o TOPO de propósito: lá está a marca do
       FABRICANTE DO TANQUE, com dois telefones legíveis. Ao mexer no
       `background-position`, conferir que eles continuam fora. -->
  <section class="marca-lado">
    <a class="marca-volta" href="/">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4 L6 10 L12 16" /></svg>
      Voltar para o site
    </a>

    <div class="marca-in">
      <img src="/static/login-logo.png" alt="General Engenharia da Manutenção" class="marca-logo" width="867" height="288" />
      <!-- Não repete a promessa do hero da landing (que já aparece no title, na
           meta description e na lede): diz o que tem ATRÁS desta porta. -->
      <p class="marca-txt">O nível dos seus reservatórios, o estado das bombas e os chamados do prédio.</p>
    </div>
  </section>

  <!-- ─── Lado do formulário ────────────────────────────────────────────── -->
  <section class="forma-lado">
    <div class="placa">
      <h1>Entrar</h1>
      <p class="placa-sub" id="placaSub">Digite seu e-mail para continuar.</p>

      <!-- ⚠️ A TELA NÃO PERGUNTA MAIS QUEM É VOCÊ (25/08/2026).
           Aqui havia um botão "Sou do condomínio — entrar sem senha", que
           obrigava a pessoa a se classificar antes de digitar qualquer coisa.
           Era a nossa modelagem de dados virada pergunta: o `role` do usuário
           já decide o caminho, e o `/auth/metodo` responde isso a partir do
           e-mail. O síndico não vê a palavra "senha"; a equipe não vê
           "código". Ninguém escolhe nada.

           Fica FORA do <form> porque serve aos dois passos seguintes — o da
           senha e o do código —, e o do código vive no `#otpStep`. -->
      <p class="identidade" id="identidade" hidden>
        <span class="identidade-rot">Entrando como</span>
        <span class="identidade-val" id="identidadeEmail"></span>
        <button type="button" class="elo" id="btnTrocar">trocar</button>
      </p>

      <form id="loginForm">
        <div class="campo" id="campoEmail">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
        </div>

        <!-- ⚠️ O CAMPO DE SENHA SÓ EXISTE PARA A EQUIPE INTERNA.
             O síndico não tem senha: quem cria o acesso dele é o escritório,
             com o e-mail, e a entrada é um código de 6 dígitos. A equipe
             interna continua com senha — para ela, código a cada login seria
             pedágio diário.
             O `required` é ligado pelo JS ao revelar o campo: `required` em
             campo escondido trava o submit sem dizer o porquê. -->
        <div class="campo" id="campoSenha" hidden>
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-amarelo" id="loginBtn">Continuar</button>
      </form>

      <!-- ⚠️ `hidden`, não `style="display:none"`. O login.js alternava
           `style.display` entre "none" e "block", e o "block" sobrescrevia o
           display do CSS — o formulário voltava do passo do código sem o
           espaçamento entre os campos. -->
      <div id="otpStep" hidden>
        <!-- Não repete o e-mail: a linha `.identidade`, logo acima, já diz
             para quem o código foi. -->
        <p class="otp-info">
          Enviamos um código de 6 dígitos. Confira a caixa de entrada — e o
          spam, se não chegar.
        </p>

        <div class="campo">
          <label for="otpCode">Código de verificação</label>
          <input type="text" id="otpCode" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
        </div>

        <label class="confiar">
          <input type="checkbox" id="otpConfiar" />
          <span>Confiar neste dispositivo</span>
        </label>

        <button type="button" id="otpBtn" class="btn btn-amarelo">Verificar</button>
        <button type="button" id="otpBack" class="btn btn-fio">Voltar</button>
      </div>

      <p id="erroMsg" class="erro" role="status" aria-live="polite"></p>

      <p class="placa-pe">
        <!-- Serve aos três passos: quem entra por código não tem senha para
             esquecer, e o motivo nº 1 de não entrar passa a ser e-mail
             cadastrado errado — que também se resolve por aqui. -->
        Não consegue entrar?
        <a href="https://wa.me/5511966536110">Fale com a gente no WhatsApp</a>
      </p>
    </div>
  </section>

</div>

  <script src="/static/login.js?v=7"></script>
  <script src="/static/register-sw.js?v=51" defer></script>
</body>
</html>
