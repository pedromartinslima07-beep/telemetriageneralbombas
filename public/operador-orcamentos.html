<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: sem ele o iOS devolve 0 em env(safe-area-inset-*)
     e a barra não tem como compensar o entalhe. Mesma correção das outras
     superfícies instaláveis (docs/arquitetura.md). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a26">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="General">
<title>GENERAL • Aprovados</title>
<link rel="icon" type="image/png" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/martianmono.woff2" as="font" type="font/woff2" crossorigin>
<!-- ⚠️ A MESMA FOLHA DO PAINEL, não uma nova. As duas telas são a mesma
     superfície do operador, e o painel do cliente já ensinou o custo de
     deixar telas irmãs divergirem: `cliente-orcamentos.html` carrega o
     `cliente.css` pelo mesmo motivo. Só o bloco `.orc-*` é exclusivo daqui,
     e ele mora no operador.css junto com o resto. -->
<link rel="stylesheet" href="/static/operador.css?v=67">
</head>
<!-- `sem-trilho`: esta tela não tem a coluna do mapa, então a barra volta a
     dividir a largura por `--area-max` sozinho. Ver o bloco no operador.css. -->
<body class="sem-trilho">

<!-- DIREÇÃO — Aprovados · 31/08/2026

     THESIS: o que já foi autorizado, por prédio. A tela responde "o que a
     gente pode executar aqui" — não "quanto custou". O item é o SERVIÇO
     aprovado, e o prédio é quem manda na leitura, porque é por prédio que o
     operador é cobrado ao telefone.
     ⚠️ NENHUM VALOR ENTRA NESTA TELA, e isso é decisão do Pedro. Não é
     ocultação no CSS: o endpoint `GET /operador/orcamentos` não devolve
     coluna de dinheiro nenhuma. Ver o comentário lá.
     OWN-WORLD: o mesmo Chapa em registro de operação do painel do turno.
     FIRST VIEWPORT: barra com a marca e a volta para o turno; abaixo, a
     contagem e a lista, do mais recente para o mais antigo. -->

<header class="barra">
  <div class="barra-in">
    <div class="marca">
      <img src="/static/logo-topo.png" alt="GENERAL" width="826" height="180">
      <span>Aprovados</span>
    </div>
  </div>
  <div class="barra-acoes">
    <nav class="barra-nav" aria-label="Telas do operador">
      <a href="/operador/painel">A fila do turno</a>
      <button type="button" data-acao="ajuda">Ajuda</button>
    </nav>
    <span class="barra-eu" id="barraEu"></span>
    <button class="conta conta-sair" id="btnSair" type="button" aria-label="Sair">
      <!-- porta à esquerda, seta saindo: o mesmo desenho do painel do
           cliente, no traço desta folha (ponta quadrada, junta em esquadro). -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M14 4H5v16h9"/><path d="M12 12h9M17.5 8l4 4-4 4"/></svg>
      <span class="conta-rot">Sair</span>
    </button>
  </div>
</header>

<main id="tela">
  <!-- O primeiro estado é "ainda não sei", nunca "está vazio" — a mesma
       regra do painel do turno. -->
  <div class="carregando" id="carregando">Carregando os orçamentos aprovados…</div>
</main>

<script src="/static/inatividade.js?v=8" defer></script>
<script src="/static/operador-orcamentos.js?v=18" defer></script>
<script src="/static/register-sw.js?v=51" defer></script>
</body>
</html>
