<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: sem ele o iOS devolve 0 em env(safe-area-inset-*)
     e a barra não tem como compensar o entalhe. Mesma correção das outras
     quatro superfícies instaláveis (docs/arquitetura.md). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a26">
<!-- Instalável como as outras quatro superfícies: quem manda no modo app é
     a PÁGINA aberta na hora de "Adicionar à Tela de Início". Sem estas
     metas, adicionar a partir do painel dá um ícone que abre aba do Safari
     (docs/arquitetura.md). -->
<!-- ⚠️ `?app=` escolhe o `start_url` do manifest. Sem ele, o ícone
     instalado no Android abre no /login em vez desta tela — o iOS não se
     importa, ele usa a página aberta na hora de instalar. Ver o bloco do
     manifest em src/app.js. -->
<link rel="manifest" href="/manifest.json?app=operador">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- "General", como nas outras quatro: é o nome do ícone na tela de
     início, e ali quem se identifica é a marca, não a tela. -->
<meta name="apple-mobile-web-app-title" content="General">
<title>GENERAL • Turno</title>
<link rel="icon" type="image/png" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/martianmono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/leaflet.css">
<link rel="stylesheet" href="/static/operador.css?v=86">
</head>
<body data-corte="nunca">

<!-- DIREÇÃO — Painel do operador · 27/08/2026

     THESIS: a fila do turno, medida pelo relógio. O item é "isto pede
     alguém", ordenado pelo SLA que estoura primeiro, e o instrumento é a
     EVIDÊNCIA dentro do item, nunca a estrutura da tela. Recusa dois
     arranjos: a lista com abas e busca do admin (o painel com menos itens)
     e a parede de instrumentos, que não tinha o que desenhar para prédio
     sem sensor.
     OWN-WORLD: Chapa em registro de operação. Marinho como material,
     chanfro de 45° em dois cantos opostos, fios de 1px como usinagem, mono
     só em medição, amarelo institucional na única ação.
     STORY: o operador vê o que estoura primeiro, entende de onde veio, e
     despacha sem sair da linha.
     FIRST VIEWPORT: barra com a marca e "Novo chamado"; abaixo, a fila
     ordenada por SLA restante começando direto no primeiro item, cada um
     com a régua de tempo à esquerda e a evidência no corpo.
     Comp aprovada: docs/comps/painel-operador-v2.html -->

<header class="barra">
  <!-- A MARCA É O WORDMARK, não a palavra composta em Archivo. É assim na
       landing, no login, no painel do cliente e no admin — `logo-topo.png` é
       a versão SEM a assinatura, que é a que aguenta escala de barra (o
       lockup do `login-logo.png` fica ilegível). Ver cliente.html. -->
  <!-- `.barra-in` existe para a barra dividir a tela como o corpo divide:
       acima de 1340px ela ganha a mesma área máxima da fila, e a marca cai
       no mesmo x do primeiro item. Mesmo mecanismo (e mesmo nome) do
       cliente.html e da landing. -->
  <div class="barra-in">
    <div class="marca">
      <img src="/static/logo-topo.png" alt="GENERAL" width="826" height="180">
      <span>Turno</span>
    </div>
  </div>
  <div class="barra-acoes">
    <!-- ⚠️ NAVEGAÇÃO É TEXTO; SÓ AÇÃO É BOTÃO — e são DUAS, uma de fio e uma
         âmbar. É a gramática da barra da landing e do painel do cliente, e
         era o que faltava aqui (31/08, pedido do Pedro: "tente deixar o
         cabeçalho parecido com cliente e landing").
         Antes eram QUATRO chips em fila — Ajuda, Aprovados, Novo chamado,
         Sair — todos com o mesmo peso de placa. Uma parede de botões não diz
         qual deles é a ação: com tudo em destaque, nada está.
         Aprovados leva a outra tela e Ajuda abre uma leitura; nenhuma das
         duas é o que se veio fazer no turno. As duas viram link de texto com
         o sublinhado âmbar que cresce da esquerda, exatamente como
         "O serviço" e "Dúvidas" na landing. -->
    <nav class="barra-nav" aria-label="Telas do operador">
      <a href="/operador/painel/orcamentos">Aprovados</a>
      <button type="button" data-acao="ajuda">Ajuda</button>
    </nav>
    <button class="btn btn-novo" data-acao="novo" aria-label="Abrir novo chamado"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="btn-rot">Novo chamado</span></button>
    <!-- ⚠️ QUEM ESTÁ LOGADO É UM ALVO, E ELE ABRE A GAVETA DE CONTA
         (03/09/2026, pedido do Pedro: "penso se não seria melhor q o nome da
         pessoa fosse um botão, e por lá ela conseguisse sair e trocar a
         senha").

         Isto SUBSTITUI o par "nome (texto) + Senha + Sair" que morou aqui
         entre 31/08 e 03/09, e revoga a regra escrita no `cliente.html` —
         "o nome é TEXTO porque um alvo que não leva a lugar nenhum ensina a
         pessoa a duvidar dos outros alvos da barra". A regra era contra alvo
         MORTO. Agora o nome leva a algum lugar, então ela é satisfeita, não
         quebrada. ⚠️ A do cliente segue valendo: lá o nome continua texto,
         porque lá não há gaveta. As duas barras divergem de propósito.

         E o motivo forte foi MEDIDO, não estético: com Senha e Sair como duas
         chapas soltas, a barra não cabia no celular — a 390px o wordmark
         pintava 37px por cima de "Aprovados" (e 83px na versão anterior a
         esta, com "Minha senha" em texto na nav). Uma chapa só devolve 50px e
         fecha a conta de 380px para cima. A tabela está no `operador.css`,
         no comentário "CELULAR ESTREITO".

         ⚠️ NÃO É `<dialog>`. Todo diálogo desta folha usa `abrirFundo` +
         `showModal()`, e aqui seria errado: modal para escolher entre dois
         itens interrompe o turno e rouba o foco de uma tela que fica aberta
         o dia inteiro. Gaveta ancorada, que fecha no Esc, no clique fora e
         ao escolher. -->
    <div class="eu" id="eu">
      <!-- O nome sai por `primeiroNome()` (o completo vai no `title`), e o
           `.conta-rot` some no celular como no resto da barra: lá o alvo é a
           silhueta sozinha, em 44px. -->
      <button class="conta conta-eu" id="btnEu" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="euGaveta">
        <!-- silhueta no traço da folha (ponta quadrada, junta em esquadro),
             não ícone de biblioteca. Cabeça e ombros, sem moldura: a moldura
             seria uma segunda caixa dentro de uma peça que já é chapa. -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5"/></svg>
        <span class="conta-rot" id="barraEu"></span>
        <!-- ⚠️ A SETA EXISTE PORQUE A BARRA MUDOU DE CONTRATO. Todo o resto
             daqui é ação direta; este é o único alvo que ABRE algo, e sem a
             seta o operador que usou a tela ontem não tem como saber que o
             nome virou porta. Some no celular junto com o rótulo — lá a
             silhueta sozinha já não promete ação direta. -->
        <svg class="eu-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
      <!-- ⚠️ IRMÃ do botão, nunca filha: `.conta` tem `clip-path`, e
           `clip-path` RECORTA a subárvore inteira — gaveta pendurada dentro
           do botão sai cortada no chanfro e ninguém entende por quê. -->
      <div class="eu-gaveta" id="euGaveta" role="menu" aria-labelledby="btnEu" hidden>
        <button class="eu-item" type="button" role="menuitem" data-acao="senha">
          <!-- chave deitada: palhetão à esquerda, haste à direita, dois dentes
               para baixo. Os ícones de biblioteca desenham a chave na
               diagonal, que briga com a ortogonal desta folha. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="7.5" cy="12" r="4.5"/><path d="M12 12h9M16.5 12v3.5M20 12v2.5"/></svg>
          <span>Trocar senha</span>
        </button>
        <!-- ⚠️ `id="btnSair"` PRESERVADO. A delegação de clique procura o Sair
             por id (é a peça compartilhada com as telas irmãs), então mudar o
             seletor aqui quebraria o logout sem erro nenhum no console.
             ⚠️ E ele NÃO é vermelho, mesmo dentro da gaveta: é a única coisa
             daqui que ninguém veio fazer. -->
        <button class="eu-item" id="btnSair" type="button" role="menuitem">
          <!-- porta à esquerda, seta saindo: o mesmo desenho do painel do
               cliente, no traço desta folha. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M14 4H5v16h9"/><path d="M12 12h9M17.5 8l4 4-4 4"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ⚠️ ESTA FAIXA SUBSTITUI O "RECEBENDO · hh:mm" DA BARRA (31/08/2026).
     O Pedro perguntou o que aquilo era, e a pergunta foi o achado: se ele não
     sabe, o operador não sabe. Medido no que existia:

       · a palavra "RECEBENDO" era FIXA — não mudava nem com o ponto vermelho,
         então a falha ficava escrita com a palavra do sucesso;
       · o texto certo ("Sem atualizar — verifique a conexão") existia só no
         `title`, que é hover: no celular não aparece nunca;
       · o relógio era a hora do computador, não a da última atualização — mas
         colado em "Recebendo" parecia "recebido às 13:55".

     Ou seja: ocupava a barra o turno inteiro para dizer "está tudo bem", que é
     justamente o que não precisa ser dito, e emudecia na hora em que
     precisava falar. É A Regra do Crítico Silencioso do DESIGN.md aplicada
     aqui: estado de risco não aparece em repouso, e quando aparece, aparece
     com PALAVRA, não com uma bolinha de 7px.

     ⚠️ E ELA NÃO PODIA SIMPLESMENTE SUMIR. A fila se recarrega sozinha a cada
     30s; sem nenhum aviso, uma queda de conexão deixa o operador despachando
     de uma lista velha sem ter como saber. O `avisar()` que já existe é faixa
     de 6 segundos — quem saiu da mesa perde. Esta fica até voltar. -->
<div class="parado" id="parado" role="status" hidden></div>

<!-- A MARCA EM ESCALA ARQUITETÔNICA, marinho sobre marinho — a mesma peça
     da landing e do painel do cliente (`.eng` em cliente.css). Presença sem
     repetir o logotipo.
     ⚠️ SÃO DOIS ELEMENTOS, e o de fora não é embrulho à toa: `.eng` é o
     RECORTE (a coluna do trilho, com overflow escondido) e `.eng-roda` é a
     peça. É isso que impede a engrenagem de encostar na coluna da fila em
     qualquer largura — sem máscara em px, que foi o que falhou duas vezes
     hoje. Quem corta a roda por dentro é o MAPA, que é opaco.
     Ver o bloco `.eng` no operador.css. -->
<div class="eng" aria-hidden="true">
  <div class="eng-roda">
  <span class="eng-a">    <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="27"/>
    <g fill="currentColor">
      <rect x="93" y="6" width="14" height="26"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(30 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(60 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(90 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(120 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(150 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(180 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(210 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(240 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(270 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(300 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(330 100 100)"/>
    </g>
  </svg></span>
  <span class="eng-b">    <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="27"/>
    <g fill="currentColor">
      <rect x="93" y="6" width="14" height="26"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(30 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(60 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(90 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(120 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(150 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(180 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(210 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(240 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(270 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(300 100 100)"/>
      <rect x="93" y="6" width="14" height="26" transform="rotate(330 100 100)"/>
    </g>
  </svg></span>
</div>
</div>

<!-- ⚠️ AQUI MORAVA O PLACAR DE TRÊS NÚMEROS, removido em 31/08/2026.
     Ele repetia, a 40px de distância, o que os cabeçalhos das duas seções
     já dizem com as mesmas palavras ("esperando alguém", "com técnico") e
     os mesmos números. O único que não estava repetido — "fora do prazo" —
     desceu para o cabeçalho da seção, colado na lista que ele conta. Ver
     o comentário em render(), no operador.js. -->

<main id="tela">
  <!-- O primeiro estado da tela é "ainda não sei", nunca "está vazio".
       Dizer "nenhum chamado aberto" antes da resposta chegar é afirmar
       calma que ninguém verificou — num painel de turno, o pior erro
       possível. -->
  <div class="carregando" id="carregando">Carregando a fila do turno…</div>
</main>
