<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudo — o desenho do reservatório</title>
<style>
@font-face{font-family:"Archivo";src:url("../../public/fonts/archivo.woff2") format("woff2");font-weight:400 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Martian Mono";src:url("../../public/fonts/martianmono.woff2") format("woff2");font-weight:400 700;font-display:swap}

:root{
  --mar-900:#030a26; --mar-800:#050f38; --mar-700:#071b5c; --mar-500:#1a3a9e;
  --agua:#2f6fe0; --crista:#8fb6ff; --amarelo:#fbb329; --risco:#ff5a4d;
  --sobre-2:#a6b5dc; --fio:rgba(255,255,255,.14);
  --rasgo:rgba(2,6,22,.55); --luz:rgba(255,255,255,.10);
  --fonte:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,monospace;
  --ch:10px;
  --corte:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--mar-900);color:#fff;font-family:var(--fonte);font-size:1.0625rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-synthesis-weight:none;padding-top:44px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
::selection{background:var(--amarelo);color:var(--mar-900)}

.andaime{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:8px;align-items:center;
  padding:9px 14px;background:#11131a;border-bottom:1px solid #2a2e3a;
  font-family:var(--mono);font-size:11px;color:#7c8496;flex-wrap:wrap}
.andaime b{color:#c9cfdd;font-weight:400;margin-right:8px}
.andaime button{padding:5px 11px;border:1px solid #2f3542;color:#9aa3b8;font-family:var(--mono);font-size:11px}
.andaime button[aria-pressed="true"]{background:#2f3542;color:#fff}

.folha{max-width:1180px;margin:0 auto;padding:clamp(28px,4vw,48px) clamp(22px,5vw,40px) 90px}
.titulo{font-size:clamp(1.8rem,3.2vw,2.5rem);font-weight:800;font-stretch:110%;letter-spacing:-.028em;line-height:1.07;max-width:22ch}
.lede{margin-top:14px;font-size:1.1rem;color:var(--sobre-2);max-width:62ch}

/* uma placa por linha: o cilindro é ATARRACADO por natureza (uma caixa d'água
   real é larga e baixa) e numa coluna estreita ele encolhia até virar miniatura
   — comparação injusta. Cada candidato recebe a largura inteira. */
.grade{display:grid;gap:clamp(16px,2vw,24px);margin-top:clamp(26px,3.6vw,40px)}
.cel{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);
  gap:clamp(20px,3vw,44px);align-items:center}
.cab{padding:0 clamp(20px,2.4vw,30px) 0 0;border-bottom:0;border-right:1px solid var(--fio);margin-bottom:0}
@media (max-width:820px){
  .cel{grid-template-columns:1fr}
  .cab{border-right:0;border-bottom:1px solid var(--fio);padding:0 0 16px;margin-bottom:24px}
}

.placa{--ch:14px;position:relative;clip-path:var(--corte);background:var(--fio);padding:1.5px}
.placa::before{content:"";position:absolute;inset:1.5px;clip-path:var(--corte);
  background:linear-gradient(168deg,var(--mar-700) 0%,var(--mar-900) 100%)}
.placa > *{position:relative;z-index:1}
.cel{padding:clamp(20px,2.4vw,30px)}
.cab{padding-bottom:16px;border-bottom:1px solid var(--fio);margin-bottom:26px}
.cab h2{font-size:1.09rem;font-weight:800}
.cab p{margin-top:6px;font-size:.9rem;color:var(--sobre-2)}

.trio{display:flex;gap:clamp(12px,2vw,22px);align-items:flex-start;justify-content:center}
.un{text-align:center;flex:0 1 auto;max-width:240px}
.un.esbelta{max-width:104px}
.pct{margin-top:14px;font-family:var(--mono);font-size:1.24rem;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.un.baixo .pct{color:var(--amarelo)}
.un.critico .pct{color:var(--risco)}
.nome{margin-top:3px;font-size:.84rem;color:var(--sobre-2);line-height:1.3}

/* ─── A · coluna chata (a que está na v3) ─── */
.tubo{--ch:8px;clip-path:var(--corte);position:relative;width:100%;height:230px;
  background:var(--mar-900);box-shadow:inset 0 0 0 1px var(--fio);overflow:hidden}
.faixa{display:block;position:absolute;left:0;right:0}
.faixa-baixo{bottom:20%;height:25%;background:color-mix(in srgb,var(--amarelo) 11%,transparent)}
.faixa-critico{bottom:0;height:20%;background:color-mix(in srgb,var(--risco) 13%,transparent)}
.agua{display:block;position:absolute;inset:0;
  background:linear-gradient(180deg,var(--agua) 0%,var(--mar-500) 70%,var(--mar-700) 100%);
  transform:translateY(calc(100% - var(--n)))}
.crista{display:block;position:absolute;left:0;right:0;top:0;height:2px;background:var(--crista)}
.un.baixo .crista{background:var(--amarelo)}
.un.critico .crista{background:var(--risco)}

/* ─── C · coluna com escala gravada ───
   as marcas ficam FORA do tubo, numa calha à esquerda: por cima da água elas
   competiam com a leitura em vez de ajudá-la */
.com-escala{position:relative;padding-left:26px}
.escala{position:absolute;left:0;top:0;bottom:0;width:26px;pointer-events:none}
.escala i{position:absolute;right:0;width:6px;height:1px;background:rgba(255,255,255,.28)}
.escala b{position:absolute;right:9px;font-family:var(--mono);font-size:.5rem;font-weight:400;
  letter-spacing:.06em;color:var(--sobre-2);transform:translateY(50%)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>

<div class="andaime">
  <b>ESTUDO — qual desenho fica</b>
  <button data-alt="trio" aria-pressed="true">As três leituras</button>
  <button data-alt="peq" aria-pressed="false">Tamanho de celular</button>
</div>

<div class="folha">
  <h1 class="titulo">Qual desenho o síndico lê melhor?</h1>
  <p class="lede">As mesmas três leituras — 78%, 38% e 12% — nos três candidatos. A água é azul nos três,
  como você decidiu: quem muda de cor é o número e a crista.</p>

  <div class="grade" id="grade"></div>
</div>

<script>
const LEITURAS = [
  {n:78, nome:"Caixa Superior",      cls:""},
  {n:38, nome:"Cisterna",            cls:"baixo"},
  {n:12, nome:"Reserva de Incêndio", cls:"critico"},
];

/* A · a coluna chata da landing, como está na v3 hoje */
function colunaChata(r, alt){
  return `<div class="un esbelta ${r.cls}">
    <div class="tubo" style="height:${alt}px">
      <span class="faixa faixa-baixo"></span><span class="faixa faixa-critico"></span>
      <span class="agua" style="--n:${r.n}%"><span class="crista"></span></span>
    </div>
    <div class="pct">${r.n}%</div><div class="nome">${r.nome}</div>
  </div>`;
}

/* C · a mesma coluna, com a escala gravada que o cilindro do admin tem */
function colunaEscala(r, alt){
  const marcas = [0,25,50,75,100].map(t =>
    `<i style="bottom:${t}%"></i><b style="bottom:${t}%">${t}</b>`).join("");
  return `<div class="un esbelta ${r.cls}">
    <div class="com-escala">
      <span class="escala" style="height:${alt}px">${marcas}</span>
      <div class="tubo" style="height:${alt}px">
        <span class="faixa faixa-baixo"></span><span class="faixa faixa-critico"></span>
        <span class="agua" style="--n:${r.n}%"><span class="crista"></span></span>
      </div>
    </div>
    <div class="pct">${r.n}%</div><div class="nome">${r.nome}</div>
  </div>`;
}

/* B · o cilindro volumétrico do admin.js (_telTanqueSVG), fielmente:
   corpo por path com elipses nas pontas, água por rect clipado + elipse de
   superfície, realce especular, sombra no chão, ticks 0–100. */
let _u = 0;
function cilindro(r, alt){
  const TOP = 20, BOT = 114, RX = 31, RY = 8, H = BOT - TOP;
  const yA = TOP + (1 - r.n/100) * H;
  const id = "k" + (_u++);
  const body = `M${50-RX} ${TOP} A${RX} ${RY} 0 0 0 ${50+RX} ${TOP} L${50+RX} ${BOT} A${RX} ${RY} 0 0 1 ${50-RX} ${BOT} Z`;
  const ticks = [0,25,50,75,100].map(t => {
    const y = TOP + (1 - t/100) * H;
    return `<line x1="10" y1="${y.toFixed(1)}" x2="15" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.3)" stroke-width="1"/>` +
           `<text x="7.5" y="${(y+2.4).toFixed(1)}" text-anchor="end" fill="#a6b5dc" font-family="Martian Mono, monospace" font-size="6">${t}</text>`;
  }).join("");
  const crista = r.cls === "critico" ? "#ff5a4d" : r.cls === "baixo" ? "#fbb329" : "#8fb6ff";
  return `<div class="un ${r.cls}">
    <svg viewBox="-8 0 108 126" style="height:${alt + 42}px;width:auto;margin-inline:auto">
      <defs>
        <clipPath id="c${id}"><path d="${body}"/></clipPath>
        <linearGradient id="b${id}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
          <stop offset=".45" stop-color="#fff" stop-opacity=".02"/>
          <stop offset="1" stop-color="#000" stop-opacity=".22"/>
        </linearGradient>
        <linearGradient id="w${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2f6fe0" stop-opacity=".95"/>
          <stop offset="1" stop-color="#2f6fe0" stop-opacity=".55"/>
        </linearGradient>
      </defs>
      ${ticks}
      <ellipse cx="50" cy="${BOT+3}" rx="${RX-3}" ry="4" fill="#000" opacity=".25"/>
      <path d="${body}" fill="url(#b${id})"/>
      <g clip-path="url(#c${id})">
        <rect x="${50-RX}" y="${yA.toFixed(1)}" width="${RX*2}" height="${(BOT-yA+RY).toFixed(1)}" fill="url(#w${id})"/>
        <ellipse cx="50" cy="${yA.toFixed(1)}" rx="${RX}" ry="${RY}" fill="#2f6fe0"/>
        <ellipse cx="50" cy="${yA.toFixed(1)}" rx="${RX}" ry="${RY}" fill="none" stroke="${crista}" stroke-opacity=".85" stroke-width="1.3"/>
      </g>
      <rect x="${50-RX+6}" y="${TOP+5}" width="4" height="${H-12}" rx="2" fill="#fff" opacity=".08"/>
      <line x1="${50-RX}" y1="${TOP}" x2="${50-RX}" y2="${BOT}" stroke="rgba(255,255,255,.34)" stroke-width="1.4"/>
      <line x1="${50+RX}" y1="${TOP}" x2="${50+RX}" y2="${BOT}" stroke="rgba(255,255,255,.34)" stroke-width="1.4"/>
      <path d="M${50-RX} ${BOT} A${RX} ${RY} 0 0 0 ${50+RX} ${BOT}" fill="none" stroke="rgba(255,255,255,.34)" stroke-width="1.4"/>
      <ellipse cx="50" cy="${TOP}" rx="${RX}" ry="${RY}" fill="#0a1746" stroke="rgba(255,255,255,.4)" stroke-width="1.4"/>
    </svg>
    <div class="pct">${r.n}%</div><div class="nome">${r.nome}</div>
  </div>`;
}

const CANDIDATOS = [
  {t:"A · Coluna chata", d:"O que está na v3 hoje. Veio da landing — o síndico reencontra a peça que viu antes de contratar. Faixas de risco atrás da água, sem escala.", f:colunaChata},
  {t:"B · Cilindro volumétrico", d:"O _telTanqueSVG do admin, que você aprovou em julho. Parece uma caixa d'água de verdade, e tem escala 0–100.", f:cilindro},
  {t:"C · Coluna com escala", d:"A coluna da landing com as marcas do cilindro. Mantém o chanfro e a continuidade, e vira instrumento de leitura completo.", f:colunaEscala},
];

let _alt = 230;

function render(){
  document.getElementById("grade").innerHTML = CANDIDATOS.map(c => `
    <div class="placa"><div class="cel">
      <div class="cab"><h2>${c.t}</h2><p>${c.d}</p></div>
      <div class="trio">${LEITURAS.map(r => c.f(r, _alt)).join("")}</div>
    </div></div>`).join("");
}

document.querySelectorAll(".andaime button").forEach(b =>
  b.addEventListener("click", () => {
    _alt = b.dataset.alt === "peq" ? 140 : 230;
    document.querySelectorAll(".andaime button").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
    render();
  }));

render();
</script>
</body>
</html>
